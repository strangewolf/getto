services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: getto
      POSTGRES_PASSWORD: getto
      POSTGRES_DB: getto
    # Host port 5433 avoids clashing with a local Postgres (Homebrew) on 5432 — use DATABASE_URL ...@127.0.0.1:5433/... from the host
    ports:
      - "5433:5432"
    volumes:
      - getto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getto -d getto"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://getto:getto@db:5432/getto
      JWT_SECRET: ${JWT_SECRET:-dev-docker-change-me}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: ["npm", "run", "dev:docker"]

volumes:
  getto_pgdata:
  web_node_modules:
